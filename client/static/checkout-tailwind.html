<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформлення замовлення (Tailwind CSS) — Dragon Food</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="font-extrabold text-xl text-emerald-500">Dragon<span class="text-slate-900">Food</span></a>
      <a href="checkout.html" class="text-sm font-semibold text-slate-600 hover:text-emerald-600">← Назад до версії на чистому CSS</a>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-8">
    <h1 class="text-2xl md:text-3xl font-extrabold mb-6">Оформлення замовлення (Tailwind версія)</h1>
    <form class="bg-white p-6 rounded-3xl border border-slate-200 shadow-lg space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1" for="tw-name">Ваше ім'я *</label>
        <input id="tw-name" type="text" required placeholder="Андрій" class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-200 focus:border-emerald-500 focus:bg-white outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1" for="tw-street">Вулиця *</label>
        <input id="tw-street" type="text" required placeholder="Вулиця Незалежності" class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-200 focus:border-emerald-500 focus:bg-white outline-none">
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-sm font-semibold mb-1" for="tw-house">Будинок *</label>
          <input id="tw-house" type="text" required placeholder="15А" class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-200 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1" for="tw-apt">Квартира *</label>
          <input id="tw-apt" type="text" required placeholder="42" class="w-full px-4 py-3 rounded-xl bg-slate-100 border border-slate-200 outline-none">
        </div>
        <div>
          <span class="block text-sm font-semibold mb-1">Домофон</span>
          <div class="inline-flex bg-slate-100 p-1 rounded-full border border-slate-200">
            <label class="px-4 py-1.5 rounded-full bg-emerald-500 text-white text-sm font-semibold cursor-pointer">
              <input type="radio" name="tw-intercom" value="yes" checked class="hidden"> Так
            </label>
            <label class="px-4 py-1.5 rounded-full text-slate-700 text-sm font-semibold cursor-pointer">
              <input type="radio" name="tw-intercom" value="no" class="hidden"> Ні
            </label>
          </div>
        </div>
      </div>
      <button type="submit" class="w-full py-3.5 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold shadow-md transition">
        Підтвердити замовлення
      </button>
    </form>
  </main>
</body>
</html>
